[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-nl"
version = "1.0.0"
description = "Robust unsupervised network anomaly detection: GRAnD (VAE + normalizing flows + EVT) with negative learning and structural early stopping"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Davide Cinelli" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grand = "grand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
